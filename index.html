<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="battle angel — a warrior's spirit needs a warrior's body. a friction-free personal gym app." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="battle angel" />
    <title>battle angel</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('battle-angel-theme')
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
